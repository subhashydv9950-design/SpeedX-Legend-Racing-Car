<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SpeedX Legend Racing Car</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: #05050a;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Landscape Game Container with Professional Neon Glow */
        .game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px 30px;
            background: radial-gradient(circle at center, #151528 0%, #080811 100%), 
                        linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.92)), 
                        url('https://images.unsplash.com/photo-1511919884226-fd3cad34687c?q=80&w=1920') no-repeat center center/cover;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .top-left-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .menu-btn, .lang-btn {
            background: rgba(10, 10, 25, 0.8);
            border: 2px solid #00f3ff;
            color: #00f3ff;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.25);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .menu-btn:hover, .lang-btn:hover {
            background: #00f3ff;
            color: #000;
            box-shadow: 0 0 22px #00f3ff;
            transform: translateY(-2px);
        }

        .coin-display {
            background: rgba(10, 10, 25, 0.85);
            border: 2px solid #ffd700;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Center Garage Showcase */
        .garage-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            position: relative;
        }

        .car-display-box {
            text-align: center;
            animation: floatCar 3.5s ease-in-out infinite;
        }

        @keyframes floatCar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .car-category {
            font-size: 12px;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .car-title {
            font-size: 34px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ff0055;
            text-shadow: 0 0 18px rgba(255, 0, 85, 0.7);
            margin-bottom: 2px;
        }

        .car-specs {
            font-size: 13px;
            color: #00f3ff;
            margin-bottom: 18px;
            letter-spacing: 1px;
        }

        .car-image-placeholder {
            width: 480px;
            height: 195px;
            background: rgba(10, 10, 20, 0.6);
            border: 2px solid rgba(0, 243, 255, 0.35);
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 17px;
            color: #fff;
            text-shadow: 0 0 12px #00f3ff;
            box-shadow: inset 0 0 25px rgba(0, 243, 255, 0.15), 0 12px 35px rgba(0,0,0,0.85);
            position: relative;
        }

        /* Slider Arrows */
        .slider-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(15, 15, 30, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: #fff;
            font-size: 22px;
            padding: 12px 18px;
            cursor: pointer;
            border-radius: 50%;
            transition: all 0.3s ease;
            z-index: 5;
        }

        .slider-arrow:hover {
            background: #ff0055;
            border-color: #ff0055;
            box-shadow: 0 0 20px #ff0055;
            transform: translateY(-50%) scale(1.1);
        }

        .left-arrow { left: 8%; }
        .right-arrow { right: 8%; }

        /* Bottom Bar: Left Side Options & Right Play Button */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 10;
        }

        /* Left Side Stylish Modification & Customization Panel */
        .garage-menu-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 440px;
        }

        .action-btn {
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.15), rgba(15, 15, 25, 0.85));
            border: 2px solid #ff0055;
            color: #fff;
            padding: 9px 12px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.2);
            text-align: center;
        }

        .action-btn:hover {
            background: #ff0055;
            color: #fff;
            box-shadow: 0 0 20px #ff0055;
            transform: translateY(-3px);
        }

        /* Right Side Play Button */
        .play-btn-container {
            display: flex;
            align-items: center;
        }

        .play-btn {
            background: linear-gradient(45deg, #00f3ff, #00ff66);
            border: none;
            color: #05050a;
            font-size: 25px;
            font-weight: 900;
            padding: 16px 50px;
            border-radius: 40px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.6);
            transition: all 0.3s ease;
            letter-spacing: 2.5px;
        }

        .play-btn:hover {
            transform: scale(1.07);
            box-shadow: 0 0 40px rgba(0, 255, 102, 0.9);
        }

        /* Professional Modal Popups Styling */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 5, 10, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: linear-gradient(135deg, #121225, #0a0a14);
            border: 2px solid #00f3ff;
            padding: 30px;
            border-radius: 20px;
            width: 450px;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.4);
            position: relative;
        }

        .modal-title {
            font-size: 22px;
            color: #00f3ff;
            margin-bottom: 15px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .modal-body {
            font-size: 14px;
            color: #ddd;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .close-modal-btn {
            background: #ff0055;
            border: none;
            color: #fff;
            padding: 10px 25px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .close-modal-btn:hover {
            box-shadow: 0 0 15px #ff0055;
        }

        .lang-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .lang-option {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(0,243,255,0.3);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .lang-option:hover {
            background: #00f3ff;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-left-group">
                <button class="menu-btn" onclick="openMenu()">☰ Menu</button>
                <button class="lang-btn" onclick="openLanguageModal()">🌐 English</button>
            </div>
            <div class="coin-display">🪙 <span id="coinVal">2,500</span></div>
        </div>

        <!-- Center Garage Showcase -->
        <div class="garage-section">
            <button class="slider-arrow left-arrow" onclick="prevCar()">❮</button>
            
            <div class="car-display-box">
                <div class="car-category" id="carCategory">Standard Class</div>
                <div class="car-title" id="carName">Vortex X-1</div>
                <div class="car-specs" id="carSpecs">Top Speed: 240 km/h | Power: 300 HP</div>
                <div class="car-image-placeholder" id="carDesignBox">
                    [ 3D Original Custom Vehicle Design ]
                </div>
            </div>

            <button class="slider-arrow right-arrow" onclick="nextCar()">❯</button>
        </div>

        <!-- Bottom Bar: Left Side Detailed Customization & Right Play -->
        <div class="bottom-bar">
            <div class="garage-menu-options">
                <button class="action-btn" onclick="openFeature('Car Paint Studio', 'Customize glossy, matte, neon body paint, and add custom text/decals.')">🎨 Car Paint</button>
                <button class="action-btn" onclick="openFeature('Body Modification', 'Upgrade bumpers, side skirts, trunk (diggi), hood, and custom rims.')">🛠️ Modify Body</button>
                <button class="action-btn" onclick="openFeature('Parts Repair Shop', 'Inspect and maintain tires, brakes, suspension, and exhaust silencer.')">⚙️ Parts Repair</button>
                <button class="action-btn" onclick="openFeature('Engine Tuning Studio', 'Upgrade pistons, turbo boost, and scale top speed up to 520 km/h!')">🔥 Engine Tuning</button>
                <button class="action-btn" onclick="openFeature('Steering & Control Setup', 'Choose Virtual Steering (Left/Right/Both), Arrow Buttons, or Gyroscope Tilt mode.')">🕹️ Steering Side</button>
                <button class="action-btn" onclick="openFeature('Full Vehicle Repair', 'Complete engine and body overhaul executed successfully.')">🔧 Full Repair</button>
            </div>

            <div class="play-btn-container">
                <button class="play-btn" onclick="startGame()">PLAY RACE</button>
            </div>
        </div>
    </div>

    <!-- Generic Professional Modal Popup -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">Title</div>
            <div class="modal-body" id="modalBody">Body text goes here...</div>
            <button class="close-modal-btn" onclick="closeModal()">OK / CLOSE</button>
        </div>
    </div>

    <!-- Language Selection Modal -->
    <div class="modal-overlay" id="langModal">
        <div class="modal-content" style="width: 500px;">
            <div class="modal-title">Select Language (भाषा चुनें)</div>
            <div class="lang-grid">
                <div class="lang-option" onclick="setLanguage('English')">🇬🇧 English (Main)</div>
                <div class="lang-option" onclick="setLanguage('Hindi')">🇮🇳 हिन्दी (Hindi)</div>
                <div class="lang-option" onclick="setLanguage('Japanese')">🇯🇵 日本語 (Japanese)</div>
                <div class="lang-option" onclick="setLanguage('Korean')">🇰🇷 한국어 (Korean)</div>
                <div class="lang-option" onclick="setLanguage('Spanish')">🇪🇸 Español</div>
                <div class="lang-option" onclick="setLanguage('German')">🇩🇪 Deutsch</div>
                <div class="lang-option" onclick="setLanguage('French')">🇫🇷 Français</div>
                <div class="lang-option" onclick="setLanguage('Russian')">🇷🇺 Русский</div>
                <div class="lang-option" onclick="setLanguage('Indonesian')">🇮🇩 Indonesia</div>
                <div class="lang-option" onclick="setLanguage('Chinese')">🇨🇳 中文</div>
            </div>
            <button class="close-modal-btn" onclick="closeLangModal()">Close</button>
        </div>
    </div>

    <script>
        // 30+ 100% Original Custom Cars Roster (No Copyright Names/Designs)
        const cars = [
            { name: "Vortex X-1", category: "Standard City Cruiser", speed: "240 km/h", power: "300 HP", price: "Free" },
            { name: "Terrain Nomad S", category: "Heavy Offroad Utility", speed: "260 km/h", power: "350 HP", price: "🪙 5,000" },
            { name: "Aero Stalker GT", category: "Sport Coupe", speed: "310 km/h", power: "550 HP", price: "🪙 12,000" },
            { name: "Apex Predator V8", category: "Super Luxury Racer", speed: "380 km/h", power: "850 HP", price: "🪙 25,000" },
            { name: "Titanium Blitz", category: "Turbo Supercar", speed: "440 km/h", power: "1150 HP", price: "🪙 50,000" },
            { name: "Nebula Hyper-X", category: "Ultimate Turbo Hypercar", speed: "520 km/h", power: "1550 HP", price: "🪙 1,00,000" },
            { name: "Quantum Storm", category: "Custom Track Monster", speed: "490 km/h", power: "1350 HP", price: "🪙 85,000" },
            { name: "Shadow Strike", category: "Stealth Supercar", speed: "460 km/h", power: "1250 HP", price: "🪙 70,000" },
            { name: "Blaze Runner", category: "Street Drifter", speed: "340 km/h", power: "620 HP", price: "🪙 18,000" },
            { name: "Iron Mammoth", category: "Heavy Armor Utility", speed: "250 km/h", power: "400 HP", price: "🪙 8,000" }
            // (Extensible up to 30+ custom unique cars)
        ];

        let currentCarIndex = 0;

        function updateCarDisplay() {
            let car = cars[currentCarIndex];
            document.getElementById("carName").innerText = car.name;
            document.getElementById("carCategory").innerText = car.category;
            document.getElementById("carSpecs").innerText = `Top Speed: ${car.speed} | Power: ${car.power} | Price: ${car.price}`;
        }

        function nextCar() {
            currentCarIndex = (currentCarIndex + 1) % cars.length;
            updateCarDisplay();
        }

        function prevCar() {
            currentCarIndex = (currentCarIndex - 1 + cars.length) % cars.length;
            updateCarDisplay();
        }

        // About / Menu Section with Developer Details
        function openMenu() {
            let info = `=== GAME INFORMATION ===\nGame: SpeedX Legend Racing Car\n\n=== DEVELOPER & FOUNDER ===\nName: Subhash Yadav\nInstagram: @iamsubhash177\nEmail: yahu9950@gmail.com`;
            openFeature("Developer About Section", info.replace(/\n/g, '<br>'));
        }

        function openFeature(title, desc) {
            document.getElementById("modalTitle").innerText = title;
            document.getElementById("modalBody").innerHTML = desc;
            document.getElementById("customModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("customModal").style.display = "none";
        }

        function openLanguageModal() {
            document.getElementById("langModal").style.display = "flex";
        }

        function closeLangModal() {
            document.getElementById("langModal").style.display = "none";
        }

        function setLanguage(lang) {
            document.querySelector(".lang-btn").innerHTML = `🌐 ${lang}`;
            closeLangModal();
        }

        function startGame() {
            openFeature("Loading Race Arena", "Initializing Game Modes (Endless Traffic, Time Attack) & Environments (City Neon Night, Snowfall, Desert Highway, Airport Runway)... Get Ready!");
        }

        // Initialize display
        updateCarDisplay();
    </script>
</body>
</html>
