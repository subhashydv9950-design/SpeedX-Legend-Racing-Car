
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#09090f">
<title>SUPERX LEGEND RACING CAR GAME</title>

<style>
/* =====================================
   SUPERX LEGEND RACING CAR GAME
   PART 1 — FOUNDATION
===================================== */

:root {
  --bg: #09090f;
  --panel: #14141e;
  --panel-light: #20202d;
  --accent: #a855f7;
  --accent-light: #c084fc;
  --red: #ff304f;
  --gold: #ffc857;
  --white: #ffffff;
  --muted: #a3a3b5;
  --border: rgba(255,255,255,0.12);
  --radius: 16px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  min-height: 100%;
  background: var(--bg);
  color: var(--white);
  font-family: Arial, Helvetica, sans-serif;
  overflow-x: hidden;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  overscroll-behavior: none;
  user-select: none;
}

button, input, select {
  font: inherit;
}

button {
  color: var(--white);
  cursor: pointer;
  border: none;
}

button:focus-visible {
  outline: 2px solid var(--accent-light);
  outline-offset: 3px;
}

img, canvas {
  max-width: 100%;
}

.hidden {
  display: none !important;
}

/* APP FOUNDATION */

#app {
  position: relative;
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  background:
    radial-gradient(
      ellipse at 50% 35%,
      rgba(105,45,180,0.16),
      transparent 60%
    ),
    var(--bg);
}

.screen {
  position: relative;
  display: none;
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
}

.screen.active {
  display: flex;
  flex-direction: column;
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

/* COMMON BUTTONS */

.btn {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 12px 18px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel-light);
  color: var(--white);
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0.4px;
  transition:
    transform 0.15s ease,
    background 0.15s ease,
    border-color 0.15s ease;
}

.btn:active {
  transform: scale(0.97);
}

.btn-primary {
  background: linear-gradient(
    135deg,
    #9333ea,
    #6d28d9
  );
  border-color: rgba(192,132,252,0.65);
  box-shadow: 0 5px 24px rgba(147,51,234,0.22);
}

.btn-danger {
  background: linear-gradient(
    135deg,
    #f43f5e,
    #be123c
  );
}

.btn-gold {
  background: linear-gradient(
    135deg,
    #fbbf24,
    #b7791f
  );
  color: #17120a;
}

.btn-block {
  width: 100%;
}

/* COMMON PANELS */

.panel {
  background: rgba(20,20,30,0.94);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}

.section-title {
  font-size: clamp(20px, 5vw, 30px);
  font-weight: 900;
  letter-spacing: 1px;
}

.muted {
  color: var(--muted);
}

.accent {
  color: var(--accent-light);
}

.gold {
  color: var(--gold);
}

/* PART 2 WILL CONTINUE HERE */
   
/* ===== SUPERX HOME SCREEN DESIGN ===== */

.home-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px 16px 8px;
  gap: 10px;
  position: relative;
  z-index: 5;
}

.menu-btn,
.profile-btn {
  background: rgba(255,255,255,0.07);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 11px 13px;
  font-size: 12px;
  font-weight: 900;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 9px;
}

.coin-pill {
  background: #24202d;
  border: 1px solid rgba(255,200,87,0.4);
  color: var(--gold);
  border-radius: 30px;
  padding: 10px 13px;
  font-size: 13px;
  font-weight: 900;
}

.profile-btn {
  width: 43px;
  height: 43px;
  padding: 0;
  font-size: 20px;
}

.brand-area {
  text-align: center;
  padding: 22px 10px 4px;
}

.brand-small {
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--muted);
  margin-bottom: 8px;
}

.brand-area h1 {
  font-size: clamp(27px, 8vw, 43px);
  font-weight: 1000;
  font-style: italic;
  letter-spacing: -1.5px;
  line-height: 1.1;
}

.brand-area h1 span {
  color: var(--accent-light);
  text-shadow: 0 0 22px rgba(168,85,247,0.55);
}

.brand-subtitle {
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 5px;
  color: #ded3f5;
  margin-top: 9px;
}

.car-showcase {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 220px;
  margin: 5px 15px 12px;
  overflow: hidden;
  border-radius: 24px;
  border: 1px solid rgba(168,85,247,0.22);
  background:
    linear-gradient(180deg, rgba(95,42,145,0.12), transparent),
    radial-gradient(ellipse at center, #29203c 0%, #111019 55%, #09090f 100%);
}

.showcase-glow {
  position: absolute;
  width: 210px;
  height: 80px;
  bottom: 58px;
  background: rgba(168,85,247,0.3);
  filter: blur(42px);
  border-radius: 50%;
}

.showcase-ring {
  position: absolute;
  width: 220px;
  height: 90px;
  bottom: 42px;
  border: 1px solid rgba(192,132,252,0.42);
  border-radius: 50%;
  transform: perspective(180px) rotateX(62deg);
  box-shadow: 0 0 22px rgba(168,85,247,0.15);
}

.car-emoji {
  position: relative;
  z-index: 1;
  font-size: clamp(82px, 25vw, 125px);
  line-height: 1.2;
  margin-top: -8px;
  filter: drop-shadow(0 12px 16px rgba(0,0,0,0.7));
}

.car-info {
  position: relative;
  z-index: 2;
  text-align: center;
  margin-top: 2px;
}

.car-tag {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 5px;
  color: var(--accent-light);
  background: rgba(168,85,247,0.12);
  font-size: 8px;
  font-weight: 900;
  letter-spacing: 2px;
}

.car-info h2 {
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 1.4px;
  margin: 7px 0 5px;
}

.car-info p {
  font-size: 10px;
  color: var(--muted);
}

.car-info strong {
  color: var(--gold);
}

.car-dots {
  display: flex;
  gap: 6px;
  margin: 13px 0 12px;
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: 10px;
  background: #555064;
}

.dot.active {
  width: 21px;
  background: var(--accent-light);
}

.home-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 0 15px;
}

.main-action {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
  min-height: 77px;
  padding: 12px 10px;
  text-align: left;
  border-radius: 15px;
  border: 1px solid rgba(255,255,255,0.1);
  background: linear-gradient(145deg, #1d1b29, #111019);
  transition: transform 0.15s, border-color 0.15s;
}

.main-action:active {
  transform: scale(0.97);
  border-color: var(--accent-light);
}

.career-action {
  border-color: rgba(168,85,247,0.5);
  background: linear-gradient(145deg, #35204c, #17111f);
}

.online-action {
  border-color: rgba(56,189,248,0.25);
}

.action-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 35px;
  height: 35px;
  flex-shrink: 0;
  border-radius: 10px;
  background: rgba(168,85,247,0.13);
  font-size: 19px;
}

.main-action > span:nth-child(2) {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.main-action strong {
  font-size: 11px;
  font-weight: 900;
  line-height: 1.2;
}

.main-action small {
  color: var(--muted);
  font-size: 8px;
  line-height: 1.4;
}

.action-arrow {
  margin-left: auto;
  color: var(--accent-light);
  font-size: 22px;
}

.home-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  padding: 18px 16px 20px;
  color: #777487;
  font-size: 9px;
  letter-spacing: 1px;
}

.home-footer button {
  background: transparent;
  color: #d8c5f5;
  font-size: 10px;
  font-weight: 800;
}

.menu-drawer {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: min(310px, 86vw);
  height: 100dvh;
  padding: 20px 15px;
  background: #111019;
  border-right: 1px solid rgba(168,85,247,0.4);
  box-shadow: 20px 0 60px rgba(0,0,0,0.6);
}

.drawer-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 25px;
}

.drawer-top h2 {
  font-size: 18px;
}

.drawer-item {
  width: 100%;
  display: block;
  text-align: left;
  padding: 15px;
  margin-bottom: 9px;
  border-radius: 11px;
  background: #1c1a27;
  border: 1px solid var(--border);
  font-weight: 800;
}

@media (min-width: 700px) {
  .screen.active {
    max-width: 900px;
    margin: 0 auto;
  }

  .car-showcase {
    min-height: 290px;
  }

  .home-actions {
    grid-template-columns: repeat(4, 1fr);
  }

  .main-action {
    flex-direction: column;
    align-items: flex-start;
    min-height: 110px;
  }
}

@media (max-width: 360px) {
  .home-actions {
    gap: 7px;
    padding: 0 10px;
  }

  .main-action {
    gap: 6px;
    padding: 9px 7px;
  }

  .action-icon {
    width: 29px;
    height: 29px;
    font-size: 16px;
  }

  .main-action strong {
    font-size: 10px;
  }
}
   
</style>
</head>
<body>

<div id="app">

<!-- THE NEXT PARTS WILL CONTINUE INSIDE THIS APP -->
   
<!-- SUPERX HOME SCREEN -->
<section id="homeScreen" class="screen active">

  <header class="home-header">
    <button class="menu-btn" onclick="toggleMenu()">☰ MENU</button>

    <div class="header-right">
      <div class="coin-pill">🪙 <span id="coinBalance">5000</span></div>
      <button class="profile-btn" onclick="showNotice('PROFILE')">👤</button>
    </div>
  </header>

  <div class="brand-area">
    <p class="brand-small">WELCOME TO THE WORLD OF SPEED</p>
    <h1>SUPERX <span>LEGEND</span></h1>
    <p class="brand-subtitle">RACING CAR GAME</p>
  </div>

  <div class="car-showcase">
    <div class="showcase-glow"></div>
    <div class="showcase-ring"></div>

    <div class="car-emoji" aria-label="Sports car">🏎️</div>

    <div class="car-info">
      <span class="car-tag">STARTER CLASS</span>
      <h2>STREET PHANTOM</h2>
      <p>TOP SPEED <strong>240 KM/H</strong></p>
    </div>

    <div class="car-dots">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>

  <div class="home-actions">
    <button class="main-action career-action"
      onclick="openSection('careerScreen')">
      <span class="action-icon">🏆</span>
      <span><strong>CAREER</strong><small>800 MAPS · OFFLINE</small></span>
      <span class="action-arrow">›</span>
    </button>

    <button class="main-action online-action"
      onclick="openSection('onlineScreen')">
      <span class="action-icon">🌐</span>
      <span><strong>ONLINE</strong><small>RACE WITH PLAYERS</small></span>
      <span class="action-arrow">›</span>
    </button>

    <button class="main-action"
      onclick="openSection('garageScreen')">
      <span class="action-icon">🚘</span>
      <span><strong>GARAGE</strong><small>35 CARS · CUSTOMIZE</small></span>
      <span class="action-arrow">›</span>
    </button>

    <button class="main-action"
      onclick="openSection('rewardsScreen')">
      <span class="action-icon">🎁</span>
      <span><strong>TASKS & REWARDS</strong><small>MISSIONS · DAILY PRIZES</small></span>
      <span class="action-arrow">›</span>
    </button>
  </div>

  <footer class="home-footer">
    <span>VERSION 1.0</span>
    <span>DRIVE YOUR LEGEND</span>
    <button onclick="openSection('settingsScreen')">⚙ SETTINGS</button>
  </footer>

</section>

<!-- HOME MENU DRAWER -->
<div id="menuDrawer" class="menu-drawer hidden">
  <div class="drawer-top">
    <h2>GAME MENU</h2>
    <button class="btn" onclick="toggleMenu()">✕</button>
  </div>
  <button class="drawer-item" onclick="openSection('careerScreen')">🏆 Career</button>
  <button class="drawer-item" onclick="openSection('onlineScreen')">🌐 Online Racing</button>
  <button class="drawer-item" onclick="openSection('garageScreen')">🚘 Garage</button>
  <button class="drawer-item" onclick="openSection('rewardsScreen')">🎁 Tasks & Rewards</button>
  <button class="drawer-item" onclick="openSection('settingsScreen')">⚙ Settings</button>
  <button class="drawer-item" onclick="openSection('aboutScreen')">ℹ About</button>
</div>
   

</div>

</body>
</html>
