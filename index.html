<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SpeedX Legend Racing Car</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: #030308;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 15px;
            background: linear-gradient(135deg, #2b0b3d 0%, #09091a 50%, #001f3f 100%);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-left {
            display: flex;
            gap: 8px;
        }

        .btn-style {
            background: rgba(15, 15, 30, 0.9);
            border: 2px solid #00f3ff;
            color: #00f3ff;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .coin-box {
            background: rgba(15, 15, 30, 0.9);
            border: 2px solid #ffd700;
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: bold;
            color: #ffd700;
        }

        .center-box {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-grow: 1;
        }

        .car-info {
            text-align: center;
        }

        .car-cat {
            font-size: 10px;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .car-name {
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            color: #ff0055;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.7);
        }

        .car-det {
            font-size: 11px;
            color: #00f3ff;
            margin-bottom: 8px;
        }

        .car-view {
            width: 320px;
            max-width: 85vw;
            height: 100px;
            background: rgba(10, 10, 25, 0.85);
            border: 2px solid rgba(0, 243, 255, 0.5);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 13px;
            color: #fff;
        }

        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: #151530;
            border: 2px solid #fff;
            color: #fff;
            font-size: 16px;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 50%;
        }

        .l-arr { left: 2%; }
        .r-arr { right: 2%; }

        .bottom-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .mod-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            flex-grow: 1;
            max-width: 450px;
        }

        .mod-btn {
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.3), rgba(15, 15, 30, 0.9));
            border: 1px solid #ff0055;
            color: #fff;
            padding: 6px 2px;
            font-size: 9px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            text-align: center;
        }

        .play-main-btn {
            background: linear-gradient(45deg, #00f3ff, #00ff66);
            border: none;
            color: #030308;
            font-size: 18px;
            font-weight: 900;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(3, 3, 8, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 15px;
        }

        .modal-box {
            background: #12122c;
            border: 2px solid #00f3ff;
            padding: 18px;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .m-title {
            font-size: 16px;
            color: #00f3ff;
            margin-bottom: 8px;
            font-weight: 900;
        }

        .m-text {
            font-size: 12px;
            color: #ddd;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .m-close {
            background: #ff0055;
            border: none;
            color: #fff;
            padding: 6px 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="top-bar">
            <div class="top-left">
                <button class="btn-style" onclick="openMenu()">☰ Menu</button>
                <button class="btn-style" onclick="alert('Languages: English, Hindi, Japanese, Korean, Spanish, German')">🌐 EN</button>
            </div>
            <div class="coin-box">🪙 2,500</div>
        </div>

        <div class="center-box">
            <button class="arrow l-arr" onclick="prevCar()">❮</button>
            <div class="car-info">
                <div class="car-cat" id="carCategory">Standard Class</div>
                <div class="car-name" id="carName">Vortex X-1</div>
                <div class="car-det" id="carSpecs">Top Speed: 240 km/h | Power: 300 HP</div>
                <div class="car-view">[ Custom Car Design ]</div>
            </div>
            <button class="arrow r-arr" onclick="nextCar()">❯</button>
        </div>

        <div class="bottom-panel">
            <div class="mod-grid">
                <button class="mod-btn" onclick="popup('Car Paint Studio', 'Change body paint colors, apply custom graphics or text.')">🎨 Paint</button>
                <button class="mod-btn" onclick="popup('Body Modification', 'Upgrade bumpers, side skirts, trunk, hood, and doors.')">🛠️ Modify</button>
                <button class="mod-btn" onclick="popup('Parts & Silencer', 'Upgrade tires grip, brakes, suspension, and exhaust silencers.')">⚙️ Parts</button>
                <button class="mod-btn" onclick="popup('Engine Tuning', 'Upgrade pistons and turbo boost up to 520 km/h.')">🔥 Engine</button>
                <button class="mod-btn" onclick="popup('Gearbox Mod', 'Switch between Auto and Manual (5-7 Gears).')">⚙️ Gearbox</button>
                <button class="mod-btn" onclick="popup('Steering Setup', 'Configure Virtual Steering, Arrows or Gyroscope Tilt.')">🕹️ Steering</button>
                <button class="mod-btn" onclick="popup('Wheel Rims', 'Upgrade alloy rims and custom tire profiles.')">🛞 Rims</button>
                <button class="mod-btn" onclick="popup('Vehicle Repair', 'Complete engine tune-up and structure repair.')">🔧 Repair</button>
            </div>
            <button class="play-main-btn" onclick="popup('Loading Race Arena', 'Starting Game Modes & Maps...')">PLAY</button>
        </div>
    </div>

    <div class="modal" id="myModal">
        <div class="modal-box">
            <div class="m-title" id="mTitle">Title</div>
            <div class="m-text" id="mText">Text</div>
            <button class="m-close" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        const cars = [
            { name: "Vortex X-1", cat: "Standard City Cruiser", speed: "240 km/h", power: "300 HP", price: "Free" },
            { name: "Terrain Nomad S", cat: "Heavy Offroad Utility", speed: "260 km/h", power: "350 HP", price: "🪙 5,000" },
            { name: "Aero Stalker GT", cat: "Sport Coupe", speed: "310 km/h", power: "550 HP", price: "🪙 12,000" },
            { name: "Apex Predator V8", cat: "Super Luxury Racer", speed: "380 km/h", power: "850 HP", price: "🪙 25,000" },
            { name: "Titanium Blitz", cat: "Turbo Supercar", speed: "440 km/h", power: "1150 HP", price: "🪙 50,000" },
            { name: "Nebula Hyper-X", cat: "Ultimate Turbo Hypercar", speed: "520 km/h", power: "1550 HP", price: "🪙 1,00,000" },
            { name: "Quantum Storm", cat: "Custom Track Monster", speed: "490 km/h", power: "1350 HP", price: "🪙 85,000" },
            { name: "Shadow Strike", cat: "Stealth Supercar", speed: "460 km/h", power: "1250 HP", price: "🪙 70,000" },
            { name: "Blaze Runner", cat: "Street Drifter", speed: "340 km/h", power: "620 HP", price: "🪙 18,000" },
            { name: "Iron Mammoth", cat: "Heavy Armor Utility", speed: "250 km/h", power: "400 HP", price: "🪙 8,000" },
            { name: "Solaris GT-R", cat: "Sport Coupe", speed: "330 km/h", power: "580 HP", price: "🪙 15,000" },
            { name: "Cyber Pulsar", cat: "Turbo Supercar", speed: "450 km/h", power: "1200 HP", price: "🪙 60,000" },
            { name: "Venom Spark", cat: "Street Drifter", speed: "350 km/h", power: "650 HP", price: "🪙 20,000" },
            { name: "Alpha Titan Pro", cat: "Heavy Offroad Utility", speed: "270 km/h", power: "380 HP", price: "🪙 9,000" },
            { name: "Spectre V12", cat: "Super Luxury Racer", speed: "400 km/h", power: "920 HP", price: "🪙 35,000" },
            { name: "Eclipse Nova", cat: "Ultimate Hypercar", speed: "510 km/h", power: "1500 HP", price: "🪙 95,000" },
            { name: "Raging Bulltech", cat: "Super Luxury Racer", speed: "420 km/h", power: "980 HP", price: "🪙 42,000" },
            { name: "Stellar Phantom", cat: "Stealth Supercar", speed: "470 km/h", power: "1280 HP", price: "🪙 75,000" },
            { name: "Drift Master X", cat: "Street Drifter", speed: "360 km/h", power: "690 HP", price: "🪙 22,000" },
            { name: "Terra Crusher", cat: "Heavy Offroad Utility", speed: "280 km/h", power: "420 HP", price: "🪙 11,000" },
            { name: "Inferno Blitz", cat: "Turbo Supercar", speed: "430 km/h", power: "1100 HP", price: "🪙 48,000" },
            { name: "Zenith GT-X", cat: "Sport Coupe", speed: "320 km/h", power: "560 HP", price: "🪙 14,000" },
            { name: "Comet Striker", cat: "Custom Track Monster", speed: "480 km/h", power: "1300 HP", price: "🪙 80,000" },
            { name: "Giga Beast S11", cat: "Heavy Offroad Utility", speed: "265 km/h", power: "370 HP", price: "🪙 7,500" },
            { name: "Apex Fortunex", cat: "Heavy Offroad Utility", speed: "275 km/h", power: "390 HP", price: "🪙 10,000" },
            { name: "Hyperion Buggtar", cat: "Ultimate Hypercar", speed: "520 km/h", power: "1550 HP", price: "🪙 1,10,000" },
            { name: "Velocity Lambex", cat: "Super Luxury Racer", speed: "410 km/h", power: "950 HP", price: "🪙 38,000" },
            { name: "Ferrariova GT", cat: "Sport Coupe", speed: "370 km/h", power: "800 HP", price: "🪙 28,000" },
            { name: "Sonic Wave", cat: "Street Drifter", speed: "345 km/h", power: "630 HP", price: "🪙 19,000" },
            { name: "Midnight Shadow", cat: "Stealth Supercar", speed: "465 km/h", power: "1260 HP", price: "🪙 72,000" },
            { name: "Thunder Vortex", cat: "Turbo Supercar", speed: "435 km/h", power: "1120 HP", price: "🪙 52,000" },
            { name: "Supernova GT", cat: "Custom Track Monster", speed: "495 km/h", power: "1380 HP", price: "🪙 90,000" }
        ];

        let idx = 0;
        function updateCar() {
            let c = cars[idx];
            document.getElementById("carName").innerText = c.name;
            document.getElementById("carCategory").innerText = `Car ${idx + 1} of ${cars.length} • ${c.cat}`;
            document.getElementById("carSpecs").innerText = `Top Speed: ${c.speed} | Power: ${c.power} | Price: ${c.price}`;
        }
        function nextCar() { idx = (idx + 1) % cars.length; updateCar(); }
        function prevCar() { idx = (idx - 1 + cars.length) % cars.length; updateCar(); }

        function openMenu() {
            popup("Developer About Section", "Game: SpeedX Legend Racing Car<br><br>Founder: Subhash Yadav<br>Instagram: @iamsubhash177<br>Email: yahu9950@gmail.com");
        }

        function popup(title, text) {
            document.getElementById("mTitle").innerText = title;
            document.getElementById("mText").innerHTML = text;
            document.getElementById("myModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("myModal").style.display = "none";
        }

        updateCar();
    </script>
</body>
</html>
