<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedX Legend Racing Car</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1a1a2e, #0f0f1a);
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1511919884226-fd3cad34687c?q=80&w=1920') no-repeat center center/cover;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .menu-btn, .lang-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #00f3ff;
            color: #00f3ff;
            padding: 10px 18px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        .menu-btn:hover, .lang-btn:hover {
            background: #00f3ff;
            color: #000;
            box-shadow: 0 0 20px #00f3ff;
        }

        .top-right-info {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .coin-display {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #ffd700;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        /* Center Garage / Car Showcase */
        .garage-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            position: relative;
        }

        .car-display-box {
            text-align: center;
            animation: floatCar 3s ease-in-out infinite;
        }

        @keyframes floatCar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .car-title {
            font-size: 36px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ff0055;
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.7);
            margin-bottom: 5px;
        }

        .car-specs {
            font-size: 14px;
            color: #00f3ff;
            margin-bottom: 20px;
        }

        .car-image-placeholder {
            width: 450px;
            height: 220px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            color: #aaa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        /* Slider Arrows */
        .slider-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #fff;
            color: #fff;
            font-size: 24px;
            padding: 12px 18px;
            cursor: pointer;
            border-radius: 50%;
            transition: 0.3s;
        }

        .slider-arrow:hover {
            background: #ff0055;
            border-color: #ff0055;
            box-shadow: 0 0 15px #ff0055;
        }

        .left-arrow { left: 15%; }
        .right-arrow { right: 15%; }

        /* Bottom Controls & Play */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .garage-menu-options {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #ff0055;
            color: #fff;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .action-btn:hover {
            background: #ff0055;
            box-shadow: 0 0 15px #ff0055;
        }

        .play-btn {
            background: linear-gradient(45deg, #00f3ff, #00ff66);
            border: none;
            color: #000;
            font-size: 26px;
            font-weight: 900;
            padding: 15px 50px;
            border-radius: 40px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.6);
            transition: 0.3s;
            letter-spacing: 2px;
        }

        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(0, 255, 102, 0.8);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <button class="menu-btn" onclick="openMenu()">☰ Menu</button>
            <div class="top-right-info">
                <button class="lang-btn" onclick="changeLanguage()">🌐 EN</button>
                <div class="coin-display">🪙 2,500</div>
            </div>
        </div>

        <!-- Center Garage Showcase (Original Custom Names & Stats) -->
        <div class="garage-section">
            <button class="slider-arrow left-arrow" onclick="prevCar()">❮</button>
            
            <div class="car-display-box">
                <div class="car-title" id="carName">Vortex X-1 (Starter)</div>
                <div class="car-specs" id="carSpecs">Top Speed: 240 km/h | Power: 300 HP</div>
                <div class="car-image-placeholder" id="carDesignBox">
                    [ Original Custom Arcade Car Design ]
                </div>
            </div>

            <button class="slider-arrow right-arrow" onclick="nextCar()">❯</button>
        </div>

        <!-- Bottom Bar -->
        <div class="bottom-bar">
            <div class="garage-menu-options">
                <button class="action-btn" onclick="openModify()">🛠️ Modify</button>
                <button class="action-btn" onclick="openPaint()">🎨 Paint</button>
                <button class="action-btn" onclick="openRepair()">🔧 Repair</button>
            </div>

            <button class="play-btn" onclick="startGame()">PLAY RACE</button>
        </div>
    </div>

    <script>
        // 100% Original Custom Car Roster (No Copyright Names/Designs)
        const cars = [
            { name: "Vortex X-1", speed: "240 km/h", power: "300 HP", type: "Standard City Cruiser" },
            { name: "Terrain Beast Pro", speed: "280 km/h", power: "420 HP", type: "Heavy Offroad Utility" },
            { name: "Apex Phantom GT", speed: "360 km/h", power: "750 HP", type: "Sport Coupe" },
            { name: "Thunderbolt V12", speed: "440 km/h", power: "1050 HP", type: "Super Hypercar" },
            { name: "Nebula Hyper-X", speed: "520 km/h", power: "1400 HP", type: "Ultimate Speed Legend" }
        ];

        let currentCarIndex = 0;

        function updateCarDisplay() {
            document.getElementById("carName").innerText = cars[currentCarIndex].name;
            document.getElementById("carSpecs").innerText = `Top Speed: ${cars[currentCarIndex].speed} | Power: ${cars[currentCarIndex].power} (${cars[currentCarIndex].type})`;
        }

        function nextCar() {
            currentCarIndex = (currentCarIndex + 1) % cars.length;
            updateCarDisplay();
        }

        function prevCar() {
            currentCarIndex = (currentCarIndex - 1 + cars.length) % cars.length;
            updateCarDisplay();
        }

        function openMenu() {
            alert("Developer & About:\nGame: SpeedX Legend Racing Car\nFounder: Subhash Yadav\nInstagram: @iamsubhash177\nEmail: yahu9950@gmail.com");
        }

        function changeLanguage() {
            alert("Multi-language switcher: English, Hindi, Spanish, Japanese, German & more!");
        }

        function openModify() {
            alert("Opening Modification Studio: Customize body parts, wheels, and performance engines!");
        }

        function openPaint() {
            alert("Opening Paint & Custom Text Shop: Change paint color and add custom text/decals!");
        }

        function openRepair() {
            alert("Repair Shop: Vehicle body and engine diagnostics normal.");
        }

        function startGame() {
            alert("Loading Game Modes, Maps (Snow, Desert, Runway), and Weather Systems...");
        }
    </script>
</body>
</html>
