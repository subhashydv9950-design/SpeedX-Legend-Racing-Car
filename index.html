<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SpeedX Legend Racing Car</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background: #030308;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #2b0b3d 0%, #09091a 50%, #001f3f 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px 15px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-left {
            display: flex;
            gap: 8px;
        }

        .btn-style {
            background: rgba(15, 15, 30, 0.95);
            border: 2px solid #00f3ff;
            color: #00f3ff;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .coin-box {
            background: rgba(15, 15, 30, 0.95);
            border: 2px solid #ffd700;
            padding: 4px 14px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            color: #ffd700;
        }

        .center-box {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-grow: 1;
        }

        .car-info {
            text-align: center;
        }

        .car-cat {
            font-size: 9px;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .car-name {
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            color: #ff0055;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.7);
        }

        .car-det {
            font-size: 10px;
            color: #00f3ff;
            margin-bottom: 5px;
        }

        .car-view {
            width: 300px;
            max-width: 75vw;
            height: 80px;
            background: rgba(10, 10, 25, 0.9);
            border: 2px solid rgba(0, 243, 255, 0.5);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            color: #fff;
        }

        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: #151530;
            border: 2px solid #fff;
            color: #fff;
            font-size: 14px;
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 50%;
        }

        .l-arr { left: 5%; }
        .r-arr { right: 5%; }

        .bottom-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .mod-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            flex-grow: 1;
            max-width: 480px;
        }

        .mod-btn {
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.3), rgba(15, 15, 30, 0.9));
            border: 1px solid #ff0055;
            color: #fff;
            padding: 5px 2px;
            font-size: 9px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            text-align: center;
        }

        .play-main-btn {
            background: linear-gradient(45deg, #00f3ff, #00ff66);
            border: none;
            color: #030308;
            font-size: 16px;
            font-weight: 900;
            padding: 10px 28px;
            border-radius: 20px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(3, 3, 8, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 10px;
        }

        .modal-box {
            background: #12122c;
            border: 2px solid #00f3ff;
            padding: 15px;
            border-radius: 10px;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .m-title {
            font-size: 15px;
            color: #00f3ff;
            margin-bottom: 6px;
            font-weight: 900;
        }

        .m-text {
            font-size: 11px;
            color: #ddd;
            margin-bottom: 10px;
            line-height: 1.4;
            max-height: 150px;
            overflow-y: auto;
            text-align: left;
        }

        .m-close {
            background: #ff0055;
            border: none;
            color: #fff;
            padding: 5px 15px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

        .lang-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
            margin-bottom: 10px;
        }

        .lang-opt {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(0,243,255,0.4);
            color: #fff;
            padding: 6px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 10px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="top-bar">
            <div class="top-left">
                <button class="btn-style" onclick="openMenu()">☰ Menu</button>
                <button class="btn-style" onclick="openLang()">🌐 EN</button>
            </div>
            <div class="coin-box">🪙 2,500</div>
        </div>

        <div class="center-box">
            <button class="arrow l-arr" onclick="prevCar()">❮</button>
            <div class="car-info">
                <div class="car-cat" id="carCategory">Standard Class • Free</div>
                <div class="car-name" id="carName">Vortex X-1</div>
                <div class="car-det" id="carSpecs">Top Speed: 240 km/h | Power: 300 HP</div>
                <div class="car-view">[ Original Custom Vehicle Design ]</div>
            </div>
            <button class="arrow r-arr" onclick="nextCar()">❯</button>
        </div>

        <div class="bottom-panel">
            <div class="mod-grid">
                <button class="mod-btn" onclick="popup('Car Painting Studio', 'Change body paint colors (Glossy, Matte, Neon), apply custom drawings, or write custom text using coins.')">🎨 Paint</button>
                <button class="mod-btn" onclick="popup('Body Modification', 'Upgrade bumpers, side skirts, trunk, hood, and doors.')">🛠️ Modify</button>
                <button class="mod-btn" onclick="popup('Parts & Silencer', 'Upgrade tires grip, brakes, suspension, and high-performance racing silencers.')">⚙️ Parts</button>
                <button class="mod-btn" onclick="popup('Engine Tuning', 'Upgrade pistons and turbo boost up to 520 km/h.')">🔥 Engine</button>
                <button class="mod-btn" onclick="popup('Gearbox Mod', 'Switch between Auto and Manual (5-7 Forward Gears + 1 Reverse).')">⚙️ Gearbox</button>
                <button class="mod-btn" onclick="popup('Steering Setup', 'Choose Virtual Steering Wheel, Arrow Buttons, or Gyroscope Tilt mode.')">🕹️ Steering</button>
                <button class="mod-btn" onclick="popup('Wheel Rims', 'Upgrade alloy rims, chrome wheels, and custom tire profiles.')">🛞 Rims</button>
                <button class="mod-btn" onclick="popup('Vehicle Repair', 'Complete engine tune-up, dent removal, and structural overhaul.')">🔧 Repair</button>
            </div>
            <button class="play-main-btn" onclick="popup('Select Game Mode & Map', 'Choose Mode:<br>1. Classic Endless Traffic<br>2. Racing Track Mode<br>3. Adventure Snow/Rain<br>4. City & Village Night<br><br>Maps & Weather loading with dynamic cameras & 7 Gears ready!')">PLAY</button>
        </div>
    </div>

    <div class="modal" id="myModal">
        <div class="modal-box">
            <div class="m-title" id="mTitle">Title</div>
            <div class="m-text" id="mText">Text</div>
            <button class="m-close" onclick="closeModal()">OK</button>
        </div>
    </div>

    <div class="modal" id="langModal">
        <div class="modal-box" style="max-width: 420px;">
            <div class="m-title">Select Language (भाषा चुनें)</div>
            <div class="lang-grid">
                <div class="lang-opt" onclick="setLang('English')">🇬🇧 English</div>
                <div class="lang-opt" onclick="setLang('Hindi')">🇮🇳 हिन्दी</div>
                <div class="lang-opt" onclick="setLang('Japanese')">🇯🇵 日本語</div>
                <div class="lang-opt" onclick="setLang('Korean')">🇰🇷 한국어</div>
                <div class="lang-opt" onclick="setLang('Spanish')">🇪🇸 Español</div>
                <div class="lang-opt" onclick="setLang('German')">🇩🇪 Deutsch</div>
                <div class="lang-opt" onclick="setLang('French')">🇫🇷 Français</div>
                <div class="lang-opt" onclick="setLang('Russian')">🇷🇺 Русский</div>
                <div class="lang-opt" onclick="setLang('Indonesian')">🇮🇩 Indonesia</div>
                <div class="lang-opt" onclick="setLang('Chinese')">🇨🇳 中文</div>
                <div class="lang-opt" onclick="setLang('Italian')">🇮🇹 Italiano</div>
                <div class="lang-opt" onclick="setLang('Thai')">🇹🇭 ไทย</div>
                <div class="lang-opt" onclick="setLang('Arabic')">🇸🇦 العربية</div>
                <div class="lang-opt" onclick="setLang('Ukrainian')">🇺🇦 Українська</div>
            </div>
            <button class="m-close" onclick="closeLang()">Close</button>
        </div>
    </div>

    <script>
        const cars = [

            { name: "Blizzard Runner", cat: "Standard City Cruiser", speed: "245 km/h", power: "310 HP", price: "🪙 ₹5 Lakhs" },
            { name: "Desert Stalker", cat: "Heavy Offroad Utility", speed: "285 km/h", power: "430 HP", price: "🪙 ₹24 Lakhs" }
        ];

        let idx = 0;
        function updateCar() {
            let c = cars[idx];
            document.getElementById("carName").innerText = c.name;
            document.getElementById("carCategory").innerText = `Car ${idx + 1} of ${cars.length} • ${c.cat}`;
            document.getElementById("carSpecs").innerText = `Top Speed: ${c.speed} | Power: ${c.power} | Price: ${c.price}`;
        }
        function nextCar() { idx = (idx + 1) % cars.length; updateCar(); }
        function prevCar() { idx = (idx - 1 + cars.length) % cars.length; updateCar(); }

        function openMenu() {
            popup("Developer About Section", "Game: SpeedX Legend Racing Car<br><br>Founder & Developer: Subhash Yadav<br>Instagram: @iamsubhash177<br>Email: yahu9950@gmail.com");
        }

        function openLang() { document.getElementById("langModal").style.display = "flex"; }
        function closeLang() { document.getElementById("langModal").style.display = "none"; }
        function setLang(l) { document.querySelector(".top-left button:nth-child(2)").innerText = `🌐 ${l}`; closeLang(); }

        function popup(title, text) {
            document.getElementById("mTitle").innerText = title;
            document.getElementById("mText").innerHTML = text;
            document.getElementById("myModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("myModal").style.display = "none";
        }

        updateCar();
    </script>
</body>
</html>
