<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedX Legend Racing Car</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: #0b0b1a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* Main Game Wrapper */
        .game-container {
            width: 100%;
            max-width: 800px;
            background: linear-gradient(135deg, #2b0b3d 0%, #09091a 50%, #001f3f 100%);
            border: 2px solid #00f3ff;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-left-group {
            display: flex;
            gap: 8px;
        }

        .menu-btn, .lang-btn {
            background: #151530;
            border: 2px solid #00f3ff;
            color: #00f3ff;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .coin-display {
            background: #151530;
            border: 2px solid #ffd700;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: bold;
            color: #ffd700;
        }

        /* Garage Showcase Section */
        .garage-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px 10px;
            position: relative;
        }

        .car-display-box {
            text-align: center;
            flex-grow: 1;
        }

        .car-category {
            font-size: 10px;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .car-title {
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            color: #ff0055;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.7);
            margin-bottom: 2px;
        }

        .car-specs {
            font-size: 11px;
            color: #00f3ff;
            margin-bottom: 8px;
        }

        .car-image-placeholder {
            width: 100%;
            height: 110px;
            background: #050510;
            border: 1px dashed rgba(0, 243, 255, 0.4);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 13px;
            color: #ccc;
        }

        .slider-arrow {
            background: #151530;
            border: 2px solid #fff;
            color: #fff;
            font-size: 16px;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 50%;
            margin: 0 5px;
        }

        .slider-arrow:hover {
            background: #ff0055;
            border-color: #ff0055;
        }

        /* Bottom Bar: Left Modifications & Right Play */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Left Side Modification Buttons Grid */
        .garage-menu-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            flex-grow: 1;
        }

        .action-btn {
            background: rgba(255, 0, 85, 0.15);
            border: 1px solid #ff0055;
            color: #fff;
            padding: 6px 4px;
            font-size: 9px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            text-align: center;
        }

        .action-btn:hover {
            background: #ff0055;
        }

        /* Right Side Play Button */
        .play-btn {
            background: linear-gradient(45deg, #00f3ff, #00ff66);
            border: none;
            color: #030308;
            font-size: 18px;
            font-weight: 900;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
        }

        .play-btn:hover {
            transform: scale(1.05);
        }

        /* Modal Popups */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(3, 3, 8, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 15px;
        }

        .modal-content {
            background: #12122c;
            border: 2px solid #00f3ff;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
        }

        .modal-title {
            font-size: 16px;
            color: #00f3ff;
            margin-bottom: 10px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .modal-body {
            font-size: 12px;
            color: #ddd;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .close-modal-btn {
            background: #ff0055;
            border: none;
            color: #fff;
            padding: 8px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .lang-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .lang-option {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(0,243,255,0.3);
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-left-group">
                <button class="menu-btn" onclick="openMenu()">☰ Menu</button>
                <button class="lang-btn" onclick="openLanguageModal()">🌐 English</button>
            </div>
            <div class="coin-display">🪙 <span id="coinVal">2,500</span></div>
        </div>

        <!-- Center Garage Showcase -->
        <div class="garage-section">
            <button class="slider-arrow" onclick="prevCar()">❮</button>
            
            <div class="car-display-box">
                <div class="car-category" id="carCategory">Standard Class</div>
                <div class="car-title" id="carName">Vortex X-1</div>
                <div class="car-specs" id="carSpecs">Top Speed: 240 km/h | Power: 300 HP</div>
                <div class="car-image-placeholder" id="carDesignBox">
                    [ Original Custom Vehicle Design ]
                </div>
            </div>

            <button class="slider-arrow" onclick="nextCar()">❯</button>
        </div>

        <!-- Bottom Bar: Left Side Upgrade/Mod Options & Right Play -->
        <div class="bottom-bar">
            <div class="garage-menu-options">
                <button class="action-btn" onclick="openFeature('Car Painting Studio', 'Change body paint colors, apply custom drawings, or write custom text on your car.')">🎨 Paint</button>
                <button class="action-btn" onclick="openFeature('Body Modification', 'Upgrade bumpers, side skirts, trunk (diggi), hood, and doors.')">🛠️ Modify</button>
                <button class="action-btn" onclick="openFeature('Parts Repair & Upgrade', 'Upgrade tires grip, braking system, suspension, and exhaust silencers.')">⚙️ Parts</button>
                <button class="action-btn" onclick="openFeature('Engine Tuning Studio', 'Upgrade pistons, turbo boost, and scale top speed up to 520 km/h!')">🔥 Engine</button>
                <button class="action-btn" onclick="openFeature('Gear System Mod', 'Switch between Automatic (2 Gears) and Manual (5 to 7 Forward + 1 Reverse).')">⚙️ Gearbox</button>
                <button class="action-btn" onclick="openFeature('Steering & Control Setup', 'Choose Virtual Steering, Arrow Buttons, or Gyroscope Tilt mode.')">🕹️ Steering</button>
                <button class="action-btn" onclick="openFeature('Wheel Rims Customizer', 'Upgrade and change alloy wheels and rim designs.')">🛞 Rims</button>
                <button class="action-btn" onclick="openFeature('Full Vehicle Repair', 'Complete engine tune-up and body repair executed successfully.')">🔧 Repair</button>
            </div>

            <div class="play-btn-container">
                <button class="play-btn" onclick="startGame()">PLAY</button>
            </div>
        </div>
    </div>

    <!-- Modal Popup -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">Title</div>
            <div class="modal-body" id="modalBody">Body text goes here...</div>
            <button class="close-modal-btn" onclick="closeModal()">OK / CLOSE</button>
        </div>
    </div>

    <!-- Language Modal -->
    <div class="modal-overlay" id="langModal">
        <div class="modal-content">
            <div class="modal-title">Select Language (भाषा चुनें)</div>
            <div class="lang-grid">
                <div class="lang-option" onclick="setLanguage('English')">🇬🇧 English</div>
                <div class="lang-option" onclick="setLanguage('Hindi')">🇮🇳 हिन्दी</div>
                <div class="lang-option" onclick="setLanguage('Japanese')">🇯🇵 日本語</div>
                <div class="lang-option" onclick="setLanguage('Korean')">🇰🇷 한국어</div>
                <div class="lang-option" onclick="setLanguage('Spanish')">🇪🇸 Español</div>
                <div class="lang-option" onclick="setLanguage('German')">🇩🇪 Deutsch</div>
            </div>
            <button class="close-modal-btn" onclick="closeLangModal()">Close</button>
        </div>
    </div>

    <script>
        const cars = [

            { name: "Nebula Hyper-X", category: "Ultimate Turbo Hypercar", speed: "520 km/h", power: "1550 HP", price: "🪙 1,00,000" },
            { name: "Quantum Storm", category: "Custom Track Monster", speed: "490 km/h", power: "1350 HP", price: "🪙 85,000" },
            { name: "Shadow Strike", category: "Stealth Supercar", speed: "460 km/h", power: "1250 HP", price: "🪙 70,000" },
            { name: "Blaze Runner", category: "Street Drifter", speed: "340 km/h", power: "620 HP", price: "🪙 18,000" },
            { name: "Iron Mammoth", category: "Heavy Armor Utility", speed: "250 km/h", power: "400 HP", price: "🪙 8,000" },
            { name: "Solaris GT-R", category: "Sport Coupe", speed: "330 km/h", power: "580 HP", price: "🪙 15,000" },
            { name: "Cyber Pulsar", group: "turbo", category: "Turbo Supercar", speed: "450 km/h", power: "1200 HP", price: "🪙 60,000" },
            { name: "Venom Spark", category: "Street Drifter", speed: "350 km/h", power: "650 HP", price: "🪙 20,000" },
            { name: "Alpha Titan Pro", category: "Heavy Offroad Utility", speed: "270 km/h", power: "380 HP", price: "🪙 9,000" },
            { name: "Spectre V12", category: "Super Luxury Racer", speed: "400 km/h", power: "920 HP", price: "🪙 35,000" },
            { name: "Eclipse Nova", category: "Ultimate Hypercar", speed: "510 km/h", power: "1500 HP", price: "🪙 95,000" },
            { name: "Raging Bulltech", category: "Super Luxury Racer", speed: "420 km/h", power: "980 HP", price: "🪙 42,000" },
            { name: "Stellar Phantom", category: "Stealth Supercar", speed: "470 km/h", power: "1280 HP", price: "🪙 75,000" },
            { name: "Drift Master X", category: "Street Drifter", speed: "360 km/h", power: "690 HP", price: "🪙 22,000" },
            { name: "Terra Crusher", category: "Heavy Offroad Utility", speed: "280 km/h", power: "420 HP", price: "🪙 11,000" },

            { name: "Zenith GT-X", category: "Sport Coupe", speed: "320 km/h", power: "560 HP", price: "🪙 14,000" },
            { name: "Comet Striker", category: "Custom Track Monster", speed: "480 km/h", power: "1300 HP", price: "🪙 80,000" },

            { name: "Sonic Wave", category: "Street Drifter", speed: "345 km/h", power: "630 HP", price: "🪙 19,000" },
            { name: "Midnight Shadow", category: "Stealth Supercar", speed: "465 km/h", power: "1260 HP", price: "🪙 72,000" },
            { name: "Thunder Vortex", category: "Turbo Supercar", speed: "435 km/h", power: "1120 HP", price: "🪙 52,000" },
            { name: "Supernova GT", category: "Custom Track Monster", speed: "495 km/h", power: "1380 HP", price: "🪙 90,000" },
            { name: "Omega Prime", category: "Ultimate Hypercar", speed: "520 km/h", power: "1600 HP", price: "🪙 1,20,000" },
            { name: "Blizzard Runner", category: "Standard City Cruiser", speed: "245 km/h", power: "310 HP", price: "🪙 2,000" },
            { name: "Desert Stalker", category: "Heavy Offroad Utility", speed: "285 km/h", power: "430 HP", price: "🪙 12,500" }
        ];

        let currentCarIndex = 0;

        function updateCarDisplay() {
            let car = cars[currentCarIndex];
            document.getElementById("carName").innerText = car.name;
            document.getElementById("carCategory").innerText = `Car ${currentCarIndex + 1} of ${cars.length} • ${car.category}`;
            document.getElementById("carSpecs").innerText = `Top Speed: ${car.speed} | Power: ${car.power} | Price: ${car.price}`;
        }

        function nextCar() {
            currentCarIndex = (currentCarIndex + 1) % cars.length;
            updateCarDisplay();
        }

        function prevCar() {
            currentCarIndex = (currentCarIndex - 1 + cars.length) % cars.length;
            updateCarDisplay();
        }

        function openMenu() {
            let info = `=== GAME INFORMATION ===\nGame: SpeedX Legend Racing Car\n\n=== DEVELOPER & FOUNDER ===\nName: Subhash Yadav\nInstagram: @iamsubhash177\nEmail: yahu9950@gmail.com`;
            openFeature("Developer About Section", info.replace(/\n/g, '<br>'));
        }

        function openFeature(title, desc) {
            document.getElementById("modalTitle").innerText = title;
            document.getElementById("modalBody").innerHTML = desc;
            document.getElementById("customModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("customModal").style.display = "none";
        }

        function openLanguageModal() {
            document.getElementById("langModal").style.display = "flex";
        }

        function closeLangModal() {
            document.getElementById("langModal").style.display = "none";
        }

        function setLanguage(lang) {
            document.querySelector(".lang-btn").innerHTML = `🌐 ${lang}`;
            closeLangModal();
        }

        function startGame() {
            openFeature("Loading Race Arena", "Initializing Game Modes & Environments... Get Ready!");
        }

        updateCarDisplay();
    </script>
</body>
</html>
